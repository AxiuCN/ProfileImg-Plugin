<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - ProfileImg-Plugin</title>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}common/ui.css"/>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}help/index.css"/>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-content-left">
        <div class="main-title">{{title}}</div>
        <div class="title-divider">
          <div class="divider-line"></div>
        </div>
        <div class="header-subtitle">{{subTitle}}</div>
      </div>
      <div class="header-stats-area">
        <div class="stat-card">
          <div class="stat-block">
            <span class="stat-label">指令</span>
            <div class="stat-value">{{commandCount}}</div>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-block">
            <span class="stat-label">分组</span>
            <div class="stat-value">{{groupCount}}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      {{each groups group}}
      <div class="grp-card card">
        <div class="grp-head">
          <span class="grp-bar"></span>
          <span class="grp-title">{{group.group}}</span>
          {{if group.auth === 'master'}}<span class="badge badge-master">仅主人</span>{{/if}}
          <span class="badge badge-main grp-count">{{group.count}} 条</span>
        </div>
        <div class="cmd-list">
          {{each group.list item}}
          <div class="cmd-row">
            <div class="cmd-title">{{item.title}}</div>
            <div class="cmd-desc">{{item.desc}}</div>
          </div>
          {{/each}}
        </div>
      </div>
      {{/each}}
    </div>

    <div class="footer">
      <div class="footer-content">
        <div class="copyright">{{@sys.copyright}}</div>
      </div>
    </div>
  </div>
</body>

</html>
