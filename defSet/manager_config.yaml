# ==============================================================
# ProfileImg-Plugin 成员管理权限配置模板（锅巴后台使用）
# 变量格式：${变量名}，由锅巴表单数据替换
# ==============================================================

# ---------- 允许使用管理指令的群成员 ----------
# qq: 群成员 QQ 号
# repos: 允许操作的图库类型（逗号分隔，可多个）
#   main      → 主图库（一体）
#   default   → default 图库
#   第三方图库名 → 如 米游社（对应 gallery_config.yaml 的 thirdParty[].name）
# 留空 = 仅允许 default 图库
managers:
${managers_list}
