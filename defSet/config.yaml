# ==============================================================
# ProfileImg-Plugin 配置文件模板（锅巴后台使用）
# 变量格式：${变量名}，由锅巴表单数据替换
# ==============================================================
gallery:
  # ---------- 统一自动更新 ----------
  # 所有图库共用此 cron，按主图库 → 屏蔽图库 → 第三方图库 → 刷新副本顺序执行
  autoUpdate:
    enabled: ${gallery_autoUpdate_enabled}
    cron: "${gallery_autoUpdate_cron}"

  # ---------- 主图库仓库元数据 ----------
  # 仓库列表由 map.json 自动决定（仓库 0 始终活跃），此处仅提供元数据补丁
  repos:
    - id: 0
      name: "miao-plugin-ProfileImg"
      remoteUrl: "${gallery_repos_0_remoteUrl}"
      autoUpdate: ${gallery_repos_0_autoUpdate}

  # ---------- default 图库 ----------
  # 手动上传面板图的默认存放目录名（位于 gallery/ProfileImg/ 下），为空时使用默认图库 default
  defaultDir: "${gallery_defaultDir}"

  # ---------- 屏蔽图库 ----------
  blocked:
    enabled: ${gallery_blocked_enabled}
    remoteUrl: "${gallery_blocked_remoteUrl}"

  # ---------- 第三方图库自动更新 ----------
  thirdPartyUpdate:
    enabled: ${gallery_thirdPartyUpdate_enabled}

  # ---------- 刷新副本 ----------
  refreshCopies:
    enabled: ${gallery_refreshCopies_enabled}

# ---------- 上传压缩设置 ----------
upload:
  enabled: ${upload_enabled}
  format: "${upload_format}"
  maxSize: ${upload_maxSize}
