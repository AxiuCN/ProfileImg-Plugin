# ==============================================================
# ProfileImg-Plugin 配置文件模板（锅巴后台使用）
# 变量格式：${变量名}，由锅巴表单数据替换
# ==============================================================
gallery:
  # ---------- 主图库仓库元数据 ----------
  # 仓库列表由 map.json 自动决定（仓库 0 始终活跃），此处仅提供元数据补丁
  repos:
    - id: 0
      name: "miao-plugin-ProfileImg"
      remoteUrl: "https://github.com/AxiuCN/miao-plugin-ProfileImg.git"
      enabled: ${gallery_repos_0_enabled}
      cron: "${gallery_repos_0_cron}"
      autoUpdate: ${gallery_repos_0_autoUpdate}
      autoRestart: ${gallery_repos_0_autoRestart}

  # ---------- 屏蔽图库 ----------
  blocked:
    enabled: ${gallery_blocked_enabled}
    remoteUrl: "https://github.com/AxiuCN/miao-plugin-ProfileImg-Blocked.git"
    cron: "${gallery_blocked_cron}"
    autoUpdate: ${gallery_blocked_autoUpdate}
    autoRestart: ${gallery_blocked_autoRestart}

# ---------- 上传压缩设置 ----------
upload:
  enabled: ${upload_enabled}
  format: "${upload_format}"
  maxSize: ${upload_maxSize}
